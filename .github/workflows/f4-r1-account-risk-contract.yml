name: F4 R1 Account Risk Contract isolated tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f4-r1-account-risk-contract.yml"
      - "paper_execution/**"
      - "pipeline/api.py"
      - "pipeline/test_api.py"
      - "pipeline/test_decision.py"

permissions:
  contents: read

concurrency:
  group: f4-r1-account-risk-contract
  cancel-in-progress: false

jobs:
  f4-r1-isolated:
    name: F4 R1 — account risk and API regression — Python 3.12.16 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and test blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            test -f "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
            printf '%s %s\\n' "$path" "$actual"
          }
          mkdir -p "$RUNNER_TEMP/f4-r1-evidence"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network_mode=none"
            echo "canonical_database_mount=none"
            echo "credentials=none"
            verify_blob paper_execution/test_f4_r1_account_contract.py e71cf941c7e59db44dcd7f3e0b948940e7f25cdc
            verify_blob paper_execution/test_risk_limits.py 3dd3afb6e7b7d361829bae0355412c468cbbc313
            verify_blob paper_execution/test_ledger.py b1b170bd890ec2cc64bf70079651f1fbf1274573
            verify_blob paper_execution/test_dual_ledger_red.py 0cf05418940a07a8357ee9d6039325a1efcb16f2
            verify_blob paper_execution/test_dual_ledger_migration_red.py 09320d363c8cb52806280c1de366895e09af3eeb
            verify_blob paper_execution/ledger.py 9cc03db8b7506543f9eef2835eb5cb7cda701d6c
            verify_blob paper_execution/database_paths.py aa813461d607069872960f1d55d6b29667a87642
            verify_blob paper_execution/test_database_paths.py 36b45c10c58d79eb84c5c3a072e15131c05d036d
            verify_blob paper_execution/risk_contract.py 7ae74740568e3bcad78acd928896ee363cc62613
            verify_blob pipeline/api.py 2c5c35951dbe902e2553ad186bedaf0ca22b29e0
            verify_blob pipeline/test_api.py f665944247f63ddc4c135099a91ad0637b02d597
            verify_blob pipeline/test_decision.py 6781f26d66635f56662a627bdd3b4a63f26c1f28
          } > "$RUNNER_TEMP/f4-r1-evidence/metadata.txt"

      - name: Run focused R1 regression tests in isolated container
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/f4-r1-evidence"
          log="$artifacts/unittest.log"
          if docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v paper_execution.test_database_paths paper_execution.test_f4_r1_account_contract paper_execution.test_risk_limits paper_execution.test_ledger paper_execution.test_dual_ledger_red paper_execution.test_dual_ledger_migration_red pipeline.test_api pipeline.test_decision \
            > "$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          cat "$log"
          test_count="$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -n 1 | awk '{print $2}' || true)"
          {
            echo "test_command=python -m unittest -v paper_execution.test_f4_r1_account_contract paper_execution.test_risk_limits paper_execution.test_ledger paper_execution.test_dual_ledger_red paper_execution.test_dual_ledger_migration_red pipeline.test_api pipeline.test_decision"
            echo "expected_test_count=160"
            echo "test_exit_code=$status"
            echo "test_count=${test_count:-NOT_REPORTED}"
          } >> "$artifacts/metadata.txt"
          if [[ "$status" -eq 0 && "$test_count" != "160" ]]; then
            echo "Expected 160 tests; observed ${test_count:-no test summary}." >&2
            status=1
          fi
          exit "$status"

      - name: Upload R1 test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f4-r1-account-risk-contract-evidence
          path: ${{ runner.temp }}/f4-r1-evidence/
          if-no-files-found: error
          retention-days: 14
