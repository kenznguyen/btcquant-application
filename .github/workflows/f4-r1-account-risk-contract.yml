name: F4 R1 Account Risk Contract isolated tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f4-r1-account-risk-contract.yml"
      - "paper_execution/**"
      - "pipeline/api.py"
      - "pipeline/test_api.py"
      - "pipeline/test_decision.py"

permissions:
  contents: read

concurrency:
  group: f4-r1-account-risk-contract
  cancel-in-progress: false

jobs:
  f4-r1-isolated:
    name: F4 R1 — account risk and API regression — Python 3.12.16 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and test blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            test -f "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
            printf '%s %s\\n' "$path" "$actual"
          }
          mkdir -p "$RUNNER_TEMP/f4-r1-evidence"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network_mode=none"
            echo "canonical_database_mount=none"
            echo "credentials=none"
            verify_blob paper_execution/test_f4_r1_account_contract.py a8b8be332e2b8e0ec9d2707b0c7cb7334ca0e851
            verify_blob paper_execution/test_risk_limits.py 3dd3afb6e7b7d361829bae0355412c468cbbc313
            verify_blob paper_execution/test_ledger.py d352303e2088cbba0538ac4709f92ab74952a4e9
            verify_blob paper_execution/test_dual_ledger_red.py 0cf05418940a07a8357ee9d6039325a1efcb16f2
            verify_blob paper_execution/ledger.py 5a04bbc27904dfab6ab139c6d5a47e538611405b
            verify_blob paper_execution/risk_contract.py 7ae74740568e3bcad78acd928896ee363cc62613
            verify_blob pipeline/api.py 0c288741afe386cacaa8d2c7d3991274a00c43ef
            verify_blob pipeline/test_api.py f7bd8ff60b489ac309b20ea78f37b0708d7bba9a
            verify_blob pipeline/test_decision.py 6781f26d66635f56662a627bdd3b4a63f26c1f28
          } > "$RUNNER_TEMP/f4-r1-evidence/metadata.txt"

      - name: Run focused R1 regression tests in isolated container
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/f4-r1-evidence"
          log="$artifacts/unittest.log"
          if docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v paper_execution.test_f4_r1_account_contract paper_execution.test_risk_limits paper_execution.test_ledger paper_execution.test_dual_ledger_red pipeline.test_api pipeline.test_decision \
            > "$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          cat "$log"
          {
            echo "test_command=python -m unittest -v paper_execution.test_f4_r1_account_contract paper_execution.test_risk_limits paper_execution.test_ledger paper_execution.test_dual_ledger_red pipeline.test_api pipeline.test_decision"
            echo "test_exit_code=$status"
            echo "test_count=$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -n 1 | awk '{print $2}' || echo NOT_REPORTED)"
          } >> "$artifacts/metadata.txt"
          exit "$status"

      - name: Upload R1 test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f4-r1-account-risk-contract-evidence
          path: ${{ runner.temp }}/f4-r1-evidence/
          if-no-files-found: error
          retention-days: 14
