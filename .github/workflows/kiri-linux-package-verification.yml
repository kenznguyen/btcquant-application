name: Kiri Linux package verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kiri-linux-package-verification.yml"

permissions: {}

concurrency:
  group: kiri-linux-package-verification
  cancel-in-progress: false

jobs:
  verify-deb-amd64:
    name: Kiri 0.2.2 Debian package / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record isolated runner baseline
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          uname -a
          dpkg --print-architecture
          systemd --version
          id
          test "$(dpkg --print-architecture)" = amd64
          test -d /run/systemd/system
          mkdir -p "$RUNNER_TEMP/kiri-evidence"

      - name: Download and verify pinned release asset
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="kiri_0.2.2_amd64.deb"
          url="https://github.com/libracoder/kiri/releases/download/v0.2.2/$asset"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 "$url" -o "$asset"
          printf '%s  %s\n' "639f64abb7f3bd063a80ed1744e891156351c56cf2ad502633c47536c397a961" "$asset" | sha256sum --check -
          dpkg-deb --info "$asset"
          dpkg-deb --field "$asset" Package Version Architecture Depends
          dpkg-deb --contents "$asset" > "$RUNNER_TEMP/kiri-evidence/package-contents.txt"
          dpkg-deb --control "$asset" "$RUNNER_TEMP/kiri-control"
          dpkg-deb --extract "$asset" "$RUNNER_TEMP/kiri-root"

      - name: Verify signed source tag and package maintainer scripts
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$RUNNER_TEMP/kiri-evidence/tag.json"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://api.github.com/repos/libracoder/kiri/git/tags/0cd223cfb2c1038068b22000b973376c7231e7a4" \
            -o "$tag_json"
          jq -e '.tag == "v0.2.2" and .verification.verified == true and .object.sha == "686bffa5f38ba6ecc3d086c36ec7148cd7fb976a"' "$tag_json" >/dev/null

          declare -A expected_blobs=(
            [postinst]="72246f6b94cc17a5e59ffbdee21bf0abfc18cffa"
            [prerm]="c5a8ec2a3f521957b2efd598d71b9fad32530f35"
            [postrm]="9172a2bf9f4c14f27584197a6d131caa09d1112e"
          )
          for script in postinst prerm postrm; do
            actual_blob="$(git hash-object "$RUNNER_TEMP/kiri-control/$script")"
            test "$actual_blob" = "${expected_blobs[$script]}"
          done
          echo "Signed tag verified; package maintainer script Git blob IDs match the pinned v0.2.2 source tree." \
            | tee "$RUNNER_TEMP/kiri-evidence/source-script-verification.txt"

      - name: Install package without starting the engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./kiri_0.2.2_amd64.deb"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' kiri
          getent group kiri
          systemctl cat kiri.service
          if systemctl is-active --quiet kiri.service; then
            echo "FAIL: fresh package installation unexpectedly started kiri.service"
            exit 1
          fi
          if systemctl is-enabled --quiet kiri.service; then
            echo "FAIL: fresh package installation unexpectedly enabled kiri.service"
            exit 1
          fi
          echo "PASS: package installation did not start or enable the engine." \
            | tee "$RUNNER_TEMP/kiri-evidence/install-inert-state.txt"

      - name: Start Kiri explicitly and run an isolated container smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl enable --now kiri.service
          for attempt in $(seq 1 30); do
            if sudo test -S /run/kiri/docker.sock; then
              break
            fi
            sleep 2
          done
          sudo test -S /run/kiri/docker.sock
          test "$(stat -c '%a:%U:%G' /run/kiri/docker.sock)" = "660:root:kiri"
          systemctl is-active --quiet kiri.service
          sudo /usr/libexec/kiri/docker --host unix:///run/kiri/docker.sock version
          sudo /usr/libexec/kiri/docker --host unix:///run/kiri/docker.sock run --rm hello-world
          sudo journalctl -u kiri.service --no-pager -n 100 \
            > "$RUNNER_TEMP/kiri-evidence/kiri-service-journal.txt"
          echo "PASS: service, socket permissions, Docker API and hello-world container." \
            | tee "$RUNNER_TEMP/kiri-evidence/runtime-smoke.txt"

      - name: Verify remove preserves data and purge deletes only runner data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if dpkg-query -W -f='${Status}' kiri 2>/dev/null | grep -q "install ok installed"; then
            sudo apt-get remove -y kiri
            if systemctl is-active --quiet kiri.service; then
              echo "FAIL: kiri.service remained active after package removal"
              exit 1
            fi
            if test -d /var/lib/kiri; then
              echo "PASS: apt remove retained Kiri data."
              sudo apt-get purge -y kiri
              test ! -e /var/lib/kiri
              test ! -e /var/lib/kiri-daemon
              echo "PASS: apt purge removed Kiri data on the disposable runner."
            else
              echo "BLOCKED: runtime data directory was not created; purge behavior not exercised."
              sudo apt-get purge -y kiri
            fi
          else
            echo "Package was not installed; uninstall lifecycle not exercised."
          fi

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Kiri Linux package verification"
            echo "- Release: Kiri 0.2.2"
            echo "- Package: kiri_0.2.2_amd64.deb"
            echo "- Runner: Ubuntu 24.04 / amd64"
            echo "- Scope: disposable GitHub-hosted runner only"
            echo "- No project VPS, T0 SQLite, T1/T2, secrets, or deployment targets are used."
            echo "- Package install, explicit service start, container smoke test, remove/purge results are in this job log."
          } >> "$GITHUB_STEP_SUMMARY"
          if test -d "$RUNNER_TEMP/kiri-evidence"; then
            find "$RUNNER_TEMP/kiri-evidence" -maxdepth 1 -type f -printf '%f\n' | sort
          fi

  verify-lite-deb-amd64:
    name: Kiri Lite 0.2.2 Debian package / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record isolated runner baseline
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          uname -a
          dpkg --print-architecture
          systemd --version
          test "$(dpkg --print-architecture)" = amd64
          test -d /run/systemd/system
          command -v docker

      - name: Download and verify pinned Kiri Lite release asset
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="kiri-lite_0.2.2_amd64.deb"
          url="https://github.com/libracoder/kiri/releases/download/v0.2.2/$asset"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 "$url" -o "$asset"
          printf '%s  %s\n' "24798125ee50bb24db86594a9ee1469b1032d9b2ffd7da616b06e40763c723b9" "$asset" | sha256sum --check -
          dpkg-deb --info "$asset"
          dpkg-deb --field "$asset" Package Version Architecture Depends
          dpkg-deb --control "$asset" "$RUNNER_TEMP/kiri-lite-control"

      - name: Verify signed source tag and package maintainer scripts
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$RUNNER_TEMP/kiri-lite-tag.json"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://api.github.com/repos/libracoder/kiri/git/tags/0cd223cfb2c1038068b22000b973376c7231e7a4" \
            -o "$tag_json"
          jq -e '.tag == "v0.2.2" and .verification.verified == true and .object.sha == "686bffa5f38ba6ecc3d086c36ec7148cd7fb976a"' "$tag_json" >/dev/null
          declare -A expected_blobs=(
            [postinst]="72246f6b94cc17a5e59ffbdee21bf0abfc18cffa"
            [prerm]="c5a8ec2a3f521957b2efd598d71b9fad32530f35"
            [postrm]="9172a2bf9f4c14f27584197a6d131caa09d1112e"
          )
          for script in postinst prerm postrm; do
            actual_blob="$(git hash-object "$RUNNER_TEMP/kiri-lite-control/$script")"
            test "$actual_blob" = "${expected_blobs[$script]}"
          done

      - name: Install Kiri Lite without starting the engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./kiri-lite_0.2.2_amd64.deb"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' kiri-lite
          getent group kiri
          if systemctl is-active --quiet kiri.service; then
            echo "FAIL: fresh Kiri Lite installation unexpectedly started kiri.service"
            exit 1
          fi
          if systemctl is-enabled --quiet kiri.service; then
            echo "FAIL: fresh Kiri Lite installation unexpectedly enabled kiri.service"
            exit 1
          fi

      - name: Start Kiri Lite and test with the runner Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl enable --now kiri.service
          for attempt in $(seq 1 30); do
            if sudo test -S /run/kiri/docker.sock; then
              break
            fi
            sleep 2
          done
          sudo test -S /run/kiri/docker.sock
          test "$(stat -c '%a:%U:%G' /run/kiri/docker.sock)" = "660:root:kiri"
          systemctl is-active --quiet kiri.service
          sudo env DOCKER_HOST=unix:///run/kiri/docker.sock docker version
          sudo env DOCKER_HOST=unix:///run/kiri/docker.sock docker run --rm hello-world
          echo "PASS: Kiri Lite works through the preinstalled Docker CLI."

      - name: Verify remove preserves data and purge deletes only runner data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if dpkg-query -W -f='${Status}' kiri-lite 2>/dev/null | grep -q "install ok installed"; then
            sudo apt-get remove -y kiri-lite
            if systemctl is-active --quiet kiri.service; then
              echo "FAIL: kiri.service remained active after Kiri Lite removal"
              exit 1
            fi
            if test -d /var/lib/kiri; then
              echo "PASS: apt remove retained Kiri Lite data."
              sudo apt-get purge -y kiri-lite
              test ! -e /var/lib/kiri
              test ! -e /var/lib/kiri-daemon
              echo "PASS: apt purge removed Kiri Lite data on the disposable runner."
            else
              echo "BLOCKED: runtime data directory was not created; purge behavior not exercised."
              sudo apt-get purge -y kiri-lite
            fi
          else
            echo "Kiri Lite was not installed; uninstall lifecycle not exercised."
          fi

      - name: Publish Kiri Lite verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Kiri Lite Linux package verification"
            echo "- Release: Kiri 0.2.2"
            echo "- Package: kiri-lite_0.2.2_amd64.deb"
            echo "- Runner: Ubuntu 24.04 / amd64"
            echo "- Scope: disposable GitHub-hosted runner only"
            echo "- No project VPS, T0 SQLite, T1/T2, secrets, or deployment targets are used."
          } >> "$GITHUB_STEP_SUMMARY"
