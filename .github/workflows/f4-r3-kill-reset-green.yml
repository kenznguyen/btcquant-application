name: F4 R3 Kill Reset Readiness GREEN

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f4-r3-kill-reset-green.yml"
      - "paper_execution/ledger.py"
      - "paper_execution/risk_control.py"
      - "paper_execution/risk_contract.py"
      - "paper_execution/test_f4_r3_reset_red.py"
      - "paper_execution/test_ledger.py"
      - "paper_execution/test_risk_control.py"
      - "paper_execution/test_dual_ledger_red.py"
      - "paper_execution/test_daily_baseline_persistence.py"
      - "pipeline/api.py"
      - "pipeline/test_api.py"
      - "paper_execution/database_paths.py"
      - "paper_execution/test_database_paths.py"
      - "pipeline/CONTRACTS.md"

permissions:
  contents: read

concurrency:
  group: f4-r3-kill-reset-green
  cancel-in-progress: false

jobs:
  f4-r3-green:
    name: F4 R3 — atomic reset GREEN — Python 3.12.16 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and test identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f4-r3-green-evidence"
          head_sha="$(git rev-parse HEAD)"
          test_blob="$(git hash-object paper_execution/test_f4_r3_reset_red.py)"
          ledger_blob="$(git hash-object paper_execution/ledger.py)"
          api_blob="$(git hash-object pipeline/api.py)"
          risk_control_blob="$(git hash-object paper_execution/risk_control.py)"
          risk_contract_blob="$(git hash-object paper_execution/risk_contract.py)"
          ledger_test_blob="$(git hash-object paper_execution/test_ledger.py)"
          api_test_blob="$(git hash-object pipeline/test_api.py)"
          dual_test_blob="$(git hash-object paper_execution/test_dual_ledger_red.py)"
          contracts_blob="$(git hash-object pipeline/CONTRACTS.md)"
          db_paths_blob="$(git hash-object paper_execution/database_paths.py)"
          db_paths_test_blob="$(git hash-object paper_execution/test_database_paths.py)"
          echo "IDENTITY head=$head_sha github_sha=$GITHUB_SHA test=$test_blob ledger=$ledger_blob api=$api_blob risk_control=$risk_control_blob risk_contract=$risk_contract_blob ledger_test=$ledger_test_blob api_test=$api_test_blob dual_test=$dual_test_blob contracts=$contracts_blob"
          [[ "$head_sha" == "$GITHUB_SHA" ]]
          [[ "$test_blob" == "ea87e42b52889ed9fd926f3d647a9b8ca87d22df" ]]
          [[ "$ledger_blob" == "9cc03db8b7506543f9eef2835eb5cb7cda701d6c" ]]
          [[ "$api_blob" == "2c5c35951dbe902e2553ad186bedaf0ca22b29e0" ]]
          [[ "$risk_control_blob" == "c8fe573a7a5b0716159e50a678423e402d7df3ba" ]]
          [[ "$risk_contract_blob" == "7ae74740568e3bcad78acd928896ee363cc62613" ]]
          [[ "$ledger_test_blob" == "71c7719d3e84be41bb7ca200b50fe6b5ee0f68e9" ]]
          [[ "$api_test_blob" == "515e4607e4d0891a6c26096c5fd60d3eaf5eeeac" ]]
          [[ "$dual_test_blob" == "0cf05418940a07a8357ee9d6039325a1efcb16f2" ]]
          [[ "$contracts_blob" == "14368ea20d56879b9c9fc6c2eddf07e8c44ab5da" ]]
          [[ "$db_paths_blob" == "e3c9504e26d81642560282c9e12f77a8c6d94454" ]]
          [[ "$db_paths_test_blob" == "36b45c10c58d79eb84c5c3a072e15131c05d036d" ]]
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "test_blob=$test_blob"
            echo "ledger_blob=$ledger_blob"
            echo "api_blob=$api_blob"
            echo "risk_control_blob=$risk_control_blob"
            echo "risk_contract_blob=$risk_contract_blob"
            echo "ledger_test_blob=$ledger_test_blob"
            echo "api_test_blob=$api_test_blob"
            echo "dual_test_blob=$dual_test_blob"
            echo "contracts_blob=$contracts_blob"
            echo "db_paths_blob=$db_paths_blob"
            echo "db_paths_test_blob=$db_paths_test_blob"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network_mode=none"
            echo "canonical_database_mount=none"
            echo "credentials=none"
          } > "$RUNNER_TEMP/f4-r3-green-evidence/metadata.txt"

      - name: Run F4 R3 and focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/f4-r3-green-evidence"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 768m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=96m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v \
              paper_execution.test_database_paths \
              paper_execution.test_f4_r3_reset_red \
              paper_execution.test_f4_risk_red \
              paper_execution.test_ledger \
              paper_execution.test_dual_ledger_red \
              pipeline.test_api \
            2>&1 | tee "$artifacts/unittest.log"
          {
            echo "result=PASS"
            echo "test_modules=5"
          } >> "$artifacts/metadata.txt"

      - name: Upload F4 R3 GREEN evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f4-r3-kill-reset-green-evidence
          path: ${{ runner.temp }}/f4-r3-green-evidence/
          if-no-files-found: error
          retention-days: 14
