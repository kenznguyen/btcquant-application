name: F4 R3 Kill Reset Readiness RED

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f4-r3-kill-reset-red.yml"
      - "paper_execution/test_f4_r3_reset_red.py"
      - "paper_execution/ledger.py"
      - "paper_execution/risk_control.py"
      - "paper_execution/risk_contract.py"
      - "pipeline/api.py"

permissions:
  contents: read

concurrency:
  group: f4-r3-kill-reset-red
  cancel-in-progress: false

jobs:
  f4-r3-red:
    name: F4 R3 — Kill reset readiness RED — Python 3.12.16 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and test identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f4-r3-evidence"
          head_sha="$(git rev-parse HEAD)"
          test_blob="$(git hash-object paper_execution/test_f4_r3_reset_red.py)"
          ledger_blob="$(git hash-object paper_execution/ledger.py)"
          risk_control_blob="$(git hash-object paper_execution/risk_control.py)"
          risk_contract_blob="$(git hash-object paper_execution/risk_contract.py)"
          api_blob="$(git hash-object pipeline/api.py)"
          echo "IDENTITY head=$head_sha github_sha=$GITHUB_SHA test=$test_blob ledger=$ledger_blob risk_control=$risk_control_blob risk_contract=$risk_contract_blob api=$api_blob"
          [[ "$head_sha" == "$GITHUB_SHA" ]]
          [[ "$test_blob" == "89247eae792bfba48adea7648d3420c914545a5b" ]]
          [[ "$ledger_blob" == "9fbf195cd6b19bd4ce2217f3648b4722a2472dcb" ]]
          [[ "$risk_control_blob" == "c8fe573a7a5b0716159e50a678423e402d7df3ba" ]]
          [[ "$risk_contract_blob" == "7ae74740568e3bcad78acd928896ee363cc62613" ]]
          [[ "$api_blob" == "0c288741afe386cacaa8d2c7d3991274a00c43ef" ]]
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "test_blob=$test_blob"
            echo "ledger_blob=$ledger_blob"
            echo "risk_control_blob=$risk_control_blob"
            echo "risk_contract_blob=$risk_contract_blob"
            echo "api_blob=$api_blob"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network_mode=none"
            echo "canonical_database_mount=none"
            echo "credentials=none"
          } > "$RUNNER_TEMP/f4-r3-evidence/metadata.txt"

      - name: Execute six F4 R3 reset/readiness specifications
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/f4-r3-evidence"
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 512m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v paper_execution.test_f4_r3_reset_red.F4KillResetAtomicReadinessRedTest \
            2>&1 | tee "$artifacts/unittest.log"
          test_exit=${PIPESTATUS[0]}
          set -e
          echo "unittest_exit_code=$test_exit" >> "$artifacts/metadata.txt"
          echo "expected_tests=6" >> "$artifacts/metadata.txt"
          echo "expected_failures=4" >> "$artifacts/metadata.txt"
          echo "expected_errors=0" >> "$artifacts/metadata.txt"
          if [[ "$test_exit" -eq 0 ]]; then
            echo "Unexpected GREEN result; phase-A RED specification changed." >&2
            exit 1
          fi
          grep -q "Ran 6 tests" "$artifacts/unittest.log"
          grep -q "FAILED (failures=4)" "$artifacts/unittest.log"
          if grep -q "errors=" "$artifacts/unittest.log"; then
            echo "Unexpected test errors; RED result is not valid." >&2
            exit 1
          fi
          echo "result=EXPECTED_RED_4_FAILURES_2_PASSES_0_ERRORS" >> "$artifacts/metadata.txt"

      - name: Upload F4 R3 RED evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f4-r3-kill-reset-red-evidence
          path: ${{ runner.temp }}/f4-r3-evidence/
          if-no-files-found: error
          retention-days: 14
