name: T0 SQLite API and Storage regression

on:
  push:
    branches:
      - main
    paths:
      - market_data/api.py
      - market_data/storage.py
      - market_data/store.py
      - market_data/postgres.py
      - market_data/feeder.py
      - market_data/write_gateway.py
      - market_data/sync.py
      - market_data/test_api.py
      - market_data/test_storage.py
      - .github/workflows/t0-sqlite-api-storage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-sqlite-api-storage
  cancel-in-progress: false

jobs:
  sqlite-api-storage:
    name: SQLite-only API and Storage regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          for file in \
            market_data/api.py market_data/storage.py market_data/store.py \
            market_data/postgres.py market_data/feeder.py market_data/write_gateway.py \
            market_data/sync.py market_data/test_api.py market_data/test_storage.py; do
            test -f "$file"
          done
          mkdir -p "$RUNNER_TEMP/t0-sqlite-api-storage-artifacts"
          chmod 0777 "$RUNNER_TEMP/t0-sqlite-api-storage-artifacts"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_commit=$GITHUB_SHA"
            echo "checked_out_source_sha=$actual"
            echo "test_scope=SQLite API and Storage only"
            echo "excluded=PostgreSQL-specific test methods; feeder lifecycle; runtime; canonical database"
            echo "expected_tests=16"
            echo "runner_image=ubuntu-24.04"
            echo "network_mode=none"
            echo "credentials=none"
            echo "canonical_database_mount=none"
          } > "$RUNNER_TEMP/t0-sqlite-api-storage-artifacts/runner_metadata.txt"

      - name: Verify Docker and pull immutable Python image
        shell: bash
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: |
          set -euo pipefail
          docker version
          docker pull --platform linux/amd64 "$PYTHON_IMAGE"
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$PYTHON_IMAGE" \
            | tee "$RUNNER_TEMP/t0-sqlite-api-storage-artifacts/container_image.txt"

      - name: Run only approved SQLite API and Storage test methods
        shell: bash
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/t0-sqlite-api-storage-artifacts"
          log="$artifacts/unittest.log"
          if docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            "$PYTHON_IMAGE" \
            python -m unittest -v \
              market_data.test_api.CandleApiTest.test_reads_persisted_decimal_candles_and_reports_gap \
              market_data.test_api.CandleApiTest.test_as_of_does_not_backdate_imported_history \
              market_data.test_api.CandleApiTest.test_missing_auth_or_store_fails_without_creating_database \
              market_data.test_api.CandleApiTest.test_invalid_duplicate_unbounded_and_unknown_parameters \
              market_data.test_api.CandleApiTest.test_read_only_methods_and_process_health \
              market_data.test_api.CandleApiTest.test_corrupt_stored_prices_are_not_served_as_validated \
              market_data.test_api.CandleApiTest.test_sync_to_reopened_api_preserves_gaps_and_observation_time \
              market_data.test_api.CandleApiTest.test_missing_sqlite_path_preserves_unconfigured_response \
              market_data.test_api.CandleApiTest.test_contract_v1_response_has_explicit_version_and_market_identity \
              market_data.test_api.CandleApiTest.test_contract_v1_freshness_reports_exact_observation_and_close_lag \
              market_data.test_api.CandleApiTest.test_contract_v1_empty_as_of_window_has_null_freshness_and_is_not_evaluable \
              market_data.test_api.CandleApiTest.test_contract_v1_candle_has_explicit_exclusive_close_and_quality_provenance \
              market_data.test_storage.StorageFactoryTest.test_sqlite_is_the_default_and_preserves_existing_path_configuration \
              market_data.test_storage.StorageFactoryTest.test_sqlite_reader_does_not_create_a_missing_database \
              market_data.test_storage.StorageFactoryTest.test_sqlite_factory_ingestion_and_read_share_one_contract \
              market_data.test_storage.StorageFactoryTest.test_sqlite_ingestion_pipeline_uses_the_factory_contract \
            > "$log" 2>&1; then
            test_status=0
          else
            test_status=$?
          fi
          cat "$log"
          test_count="$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -n 1 | awk '{print $2}' || true)"
          {
            echo "test_command=explicit SQLite-only unittest method allowlist"
            echo "test_count=${test_count:-NOT_REPORTED}"
            echo "test_exit_code=$test_status"
          } >> "$artifacts/runner_metadata.txt"
          {
            echo "## T0 SQLite API and Storage regression"
            echo
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Approved tests: ${test_count:-NOT_REPORTED} (expected 16)"
            echo "- PostgreSQL-specific methods: excluded"
            echo "- Feeder lifecycle tests: excluded"
            echo "- Network: disabled in test container"
            echo "- Canonical database/runtime: not mounted or accessed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" -eq 0 && "$test_count" != "16" ]]; then
            echo "Expected 16 SQLite-only tests; observed ${test_count:-no test summary}." >&2
            exit 1
          fi
          exit "$test_status"

      - name: Upload SQLite API and Storage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t0-sqlite-api-storage-evidence
          path: ${{ runner.temp }}/t0-sqlite-api-storage-artifacts/
          if-no-files-found: error
          retention-days: 14
