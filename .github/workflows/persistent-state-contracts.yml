name: Persistent State contract tests

on:
  push:
    branches:
      - main
    paths:
      - "persistent_state/**"
      - "paper_execution/**"
      - "pipeline/**"
      - ".github/workflows/persistent-state-contracts.yml"

permissions:
  contents: read

concurrency:
  group: persistent-state-contracts
  cancel-in-progress: false

jobs:
  contract-tests:
    name: Persistent State contracts — isolated Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact source and test environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/persistent-state-evidence"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$GITHUB_REF_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "python_version=$(python3 --version)"
            echo "network_access=not_used_by_test"
            echo "database=none"
            echo "T0_access=none"
            echo "runtime=none"
          } > "$RUNNER_TEMP/persistent-state-evidence/metadata.txt"

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v persistent_state.test_contracts persistent_state.test_repository persistent_state.test_replay_checkpoint persistent_state.test_session_fencing persistent_state.test_recovery persistent_state.test_preflight persistent_state.test_risk_admission persistent_state.test_lifecycle persistent_state.test_evidence persistent_state.test_ready_repository_gate persistent_state.test_orchestrator persistent_state.test_account_risk_snapshot persistent_state.test_account_risk_admission persistent_state.test_account_risk_binding 2>&1 | tee "$RUNNER_TEMP/persistent-state-evidence/unittest.log"

      - name: Run adjacent paper ledger and strategy API regressions in isolated container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v \
              paper_execution.test_database_paths \
              paper_execution.test_f4_r1_account_contract \
              paper_execution.test_f4_r3_reset_red \
              paper_execution.test_market_mark_provenance \
              paper_execution.test_dual_strategy_api_red \
              paper_execution.test_versioned_risk_policy_store \
              paper_execution.test_risk_limits \
              paper_execution.test_ledger \
              paper_execution.test_dual_ledger_red \
              paper_execution.test_dual_ledger_migration_red \
              pipeline.test_api \
              pipeline.test_decision \
            2>&1 | tee "$RUNNER_TEMP/persistent-state-evidence/adjacent-regression.log"

      - name: Upload contract test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persistent-state-contract-test-evidence
          path: ${{ runner.temp }}/persistent-state-evidence/
          if-no-files-found: error
          retention-days: 14
