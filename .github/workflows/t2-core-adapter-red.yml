name: T2 Core Adapter contract tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t2-core-adapter-red.yml"
      - "core_runtime/adapter.py"
      - "core_runtime/test_adapter_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-core-adapter-contract
  cancel-in-progress: false

jobs:
  core-adapter-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and immutable blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object core_runtime/adapter.py)" = "9795c346d2eec4c78c22035c32f463af6b40b8f4"
          test "$(git hash-object core_runtime/test_adapter_contract.py)" = "fbe6cc428fd7058a6dbefd9eaec1979a95638474"
          mkdir -p "$RUNNER_TEMP/t2-green-evidence"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "adapter_blob_sha=$(git hash-object core_runtime/adapter.py)"
            echo "test_blob_sha=$(git hash-object core_runtime/test_adapter_contract.py)"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network=none"
            echo "credentials=none"
            echo "database_mount=none"
          } > "$RUNNER_TEMP/t2-green-evidence/metadata.txt"

      - name: Pull immutable Python image
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: docker pull --platform linux/amd64 "$PYTHON_IMAGE"

      - name: Run Core adapter contract tests
        shell: bash
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/t2-green-evidence/green-test.log"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 \
            --memory 1g --cpus 1 --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --env PYTHONPATH=/workspace --env PYTHONDONTWRITEBYTECODE=1 \
            --workdir /workspace "$PYTHON_IMAGE" \
            python -m unittest -v core_runtime.test_adapter_contract > "$log" 2>&1
          cat "$log"
          test_count="$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -n 1 | awk '{print $2}')"
          test "$test_count" = "6"
          echo "test_count=$test_count" >> "$RUNNER_TEMP/t2-green-evidence/metadata.txt"
          echo "test_status=PASS" >> "$RUNNER_TEMP/t2-green-evidence/metadata.txt"
          {
            echo "## T2 Core Adapter GREEN"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Adapter blob: 9795c346d2eec4c78c22035c32f463af6b40b8f4"
            echo "- Tests passed: $test_count / 6"
            echo "- Network/database/exchange access: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t2-core-adapter-green-evidence
          path: ${{ runner.temp }}/t2-green-evidence/
          if-no-files-found: error
          retention-days: 14
