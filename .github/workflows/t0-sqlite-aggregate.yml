name: T0 SQLite-only aggregate regression

on:
  push:
    branches:
      - main
    paths:
      - market_data/api.py
      - market_data/fastapi_app.py
      - market_data/api_contract.py
      - requirements-market-data-fastapi.lock
      - requirements-market-data-fastapi-test.lock
      - requirements-market-data-fastapi.sha256
      - .github/workflows/t0-fastapi-migration.yml
      - market_data/test_fastapi_api.py
      - market_data/initialize_sqlite.py
      - market_data/feeder.py
      - market_data/feeder_service.py
      - market_data/store.py
      - market_data/storage.py
      - market_data/sync.py
      - market_data/write_gateway.py
      - market_data/test_api.py
      - market_data/test_initialize_sqlite.py
      - market_data/test_store.py
      - market_data/test_fenced_store.py
      - market_data/test_feeder_health.py
      - market_data/test_feeder_retry.py
      - market_data/test_feeder_scheduler.py
      - market_data/test_controlled_ingestion_acceptance.py
      - market_data/test_t0_controlled_ingestion_acceptance.py
      - market_data/test_storage.py
      - market_data/test_write_gateway.py
      - market_data/test_sync.py
      - market_data/test_feeder_lease.py
      - market_data/test_feeder_recovery.py
      - market_data/test_feeder_lifecycle.py
      - market_data/test_feeder_service_lifecycle.py
      - .github/workflows/t0-sqlite-aggregate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-sqlite-aggregate
  cancel-in-progress: false

jobs:
  sqlite-aggregate:
    name: Aggregate SQLite-only T0 contract suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          for file in \
            market_data/api.py market_data/initialize_sqlite.py \
            market_data/feeder.py market_data/feeder_service.py \
            market_data/store.py market_data/storage.py market_data/sync.py \
            market_data/write_gateway.py market_data/test_api.py \
            market_data/test_initialize_sqlite.py market_data/test_store.py \
            market_data/test_fenced_store.py market_data/test_feeder_health.py \
            market_data/test_feeder_retry.py market_data/test_feeder_scheduler.py \
            market_data/test_controlled_ingestion_acceptance.py \
            market_data/test_t0_controlled_ingestion_acceptance.py \
            market_data/test_storage.py \
            market_data/test_write_gateway.py market_data/test_sync.py \
            market_data/test_feeder_lease.py market_data/test_feeder_recovery.py \
            market_data/test_feeder_lifecycle.py market_data/test_feeder_service_lifecycle.py; do
            test -f "$file"
          done
          mkdir -p "$RUNNER_TEMP/t0-sqlite-aggregate-artifacts"
          chmod 0777 "$RUNNER_TEMP/t0-sqlite-aggregate-artifacts"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_commit=$GITHUB_SHA"
            echo "checked_out_source_sha=$actual"
            echo "expected_tests=196"
            echo "test_scope=SQLite initializer/store/fencing, API/storage, write gateway, sync, lease, recovery, health, retry, scheduler, controlled ingestion and deterministic lifecycle"
            echo "postgresql_tests=excluded"
            echo "canonical_database=not mounted"
            echo "production_runtime=excluded"
            echo "exchange_or_external_network=excluded"
            echo "credentials=none"
          } > "$RUNNER_TEMP/t0-sqlite-aggregate-artifacts/runner_metadata.txt"

      - name: Pull immutable Python 3.12.16 image
        shell: bash
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: |
          set -euo pipefail
          docker version
          docker pull --platform linux/amd64 "$PYTHON_IMAGE"
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$PYTHON_IMAGE" \
            | tee "$RUNNER_TEMP/t0-sqlite-aggregate-artifacts/container_image.txt"

      - name: Run explicit SQLite-only allowlist
        shell: bash
        env:
          PYTHON_IMAGE: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/t0-sqlite-aggregate-artifacts"
          log="$artifacts/unittest.log"
          if docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            "$PYTHON_IMAGE" \
            python -m unittest -v \
              market_data.test_initialize_sqlite \
              market_data.test_store \
              market_data.test_fenced_store \
              market_data.test_feeder_health \
              market_data.test_feeder_retry \
              market_data.test_feeder_scheduler \
              market_data.test_controlled_ingestion_acceptance \
              market_data.test_t0_controlled_ingestion_acceptance \
              market_data.test_write_gateway \
              market_data.test_sync \
              market_data.test_feeder_lease \
              market_data.test_feeder_recovery \
              market_data.test_feeder_lifecycle \
              market_data.test_feeder_service_lifecycle \
              market_data.test_api.CandleApiTest.test_reads_persisted_decimal_candles_and_reports_gap \
              market_data.test_api.CandleApiTest.test_as_of_does_not_backdate_imported_history \
              market_data.test_api.CandleApiTest.test_missing_auth_or_store_fails_without_creating_database \
              market_data.test_api.CandleApiTest.test_invalid_duplicate_unbounded_and_unknown_parameters \
              market_data.test_api.CandleApiTest.test_read_only_methods_and_process_health \
              market_data.test_api.CandleApiTest.test_corrupt_stored_prices_are_not_served_as_validated \
              market_data.test_api.CandleApiTest.test_sync_to_reopened_api_preserves_gaps_and_observation_time \
              market_data.test_api.CandleApiTest.test_missing_sqlite_path_preserves_unconfigured_response \
              market_data.test_api.CandleApiTest.test_contract_v1_response_has_explicit_version_and_market_identity \
              market_data.test_api.CandleApiTest.test_contract_v1_freshness_requires_complete_coverage \
              market_data.test_api.CandleApiTest.test_contract_v1_complete_current_window_is_evaluable \
              market_data.test_api.CandleApiTest.test_contract_v1_stale_latest_candle_is_not_fresh_or_evaluable \
              market_data.test_api.CandleApiTest.test_contract_v1_historical_as_of_anchors_freshness_to_replay_time \
              market_data.test_api.CandleApiTest.test_contract_v1_future_as_of_is_rejected \
              market_data.test_api.CandleApiTest.test_contract_v1_future_availability_timestamp_is_invalid \
              market_data.test_api.CandleApiTest.test_contract_v1_empty_as_of_window_has_null_freshness_and_is_not_evaluable \
              market_data.test_api.CandleApiTest.test_contract_v1_candle_has_explicit_exclusive_close_and_quality_provenance \
              market_data.test_storage.StorageFactoryTest.test_sqlite_is_the_default_and_preserves_existing_path_configuration \
              market_data.test_storage.StorageFactoryTest.test_sqlite_reader_does_not_create_a_missing_database \
              market_data.test_storage.StorageFactoryTest.test_sqlite_factory_ingestion_and_read_share_one_contract \
              market_data.test_storage.StorageFactoryTest.test_sqlite_ingestion_pipeline_uses_the_factory_contract \
            > "$log" 2>&1; then
            test_status=0
          else
            test_status=$?
          fi
          cat "$log"
          test_count="$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -n 1 | awk '{print $2}' || true)"
          {
            echo "test_count=${test_count:-NOT_REPORTED}"
            echo "test_exit_code=$test_status"
          } >> "$artifacts/runner_metadata.txt"
          {
            echo "## T0 SQLite-only aggregate regression"
            echo
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Observed tests: ${test_count:-NOT_REPORTED} (expected 196)"
            echo "- PostgreSQL-specific API/Storage tests excluded"
            echo "- No canonical DB, production runtime, exchange, network or credentials"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" -eq 0 && "$test_count" != "196" ]]; then
            echo "Expected 196 tests; observed ${test_count:-no test summary}." >&2
            exit 1
          fi
          exit "$test_status"

      - name: Upload aggregate regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t0-sqlite-aggregate-evidence
          path: ${{ runner.temp }}/t0-sqlite-aggregate-artifacts/
          if-no-files-found: error
          retention-days: 14
