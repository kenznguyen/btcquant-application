name: T0 importer-core synthetic TDD

on:
  push:
    branches:
      - main
    paths:
      - market_data/archive_importer_core.py
      - market_data/test_archive_importer_core.py
      - market_data/archive_staging_adapter.py
      - market_data/test_archive_staging_adapter.py
      - requirements-market-data-fastapi-test.lock
      - requirements-market-data-fastapi.sha256
      - .github/workflows/t0-importer-core-synthetic.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact 40-character commit SHA (defaults to the dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: t0-importer-core-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importer-core-synthetic:
    name: Importer-core synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate requested source SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          fi
          echo "Requested source SHA: $REQUESTED_SHA"

      - name: Checkout exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'requested=%s\nactual=%s\n' "$REQUESTED_SHA" "$actual"
          test "$actual" = "$REQUESTED_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run focused synthetic importer-core tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v market_data.test_archive_importer_core

      - name: Run focused synthetic S1.2 adapter tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v market_data.test_archive_staging_adapter

      - name: Set up Python 3.12.16 for full market_data regression
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.16"

      - name: Install committed hash-locked market_data test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c requirements-market-data-fastapi.sha256
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-market-data-fastapi-test.lock

      - name: Run complete market_data regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -v -s market_data -p 'test_*.py'
