name: F4 R2 Kill Switch GREEN

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f4-r2-kill-switch-green.yml"
      - "paper_execution/risk_control.py"
      - "paper_execution/test_f4_risk_red.py"

permissions:
  contents: read

concurrency:
  group: f4-r2-kill-switch-green
  cancel-in-progress: false

jobs:
  f4-r2-green:
    name: F4 R2 — Kill Switch fail-closed GREEN — Python 3.12.16 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and test identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f4-r2-evidence"
          head_sha="$(git rev-parse HEAD)"
          source_blob="$(git hash-object paper_execution/risk_control.py)"
          test_blob="$(git hash-object paper_execution/test_f4_risk_red.py)"
          echo "IDENTITY head=$head_sha github_sha=$GITHUB_SHA source=$source_blob test=$test_blob"
          [[ "$head_sha" == "$GITHUB_SHA" ]]
          [[ "$source_blob" == "c8fe573a7a5b0716159e50a678423e402d7df3ba" ]]
          [[ "$test_blob" == "7e03122ee72cb88cd039d99ca4a9ed6acfe1f656" ]]
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "risk_control_blob=$source_blob"
            echo "test_blob=$test_blob"
            echo "python_image=python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
            echo "network_mode=none"
            echo "canonical_database_mount=none"
            echo "credentials=none"
          } > "$RUNNER_TEMP/f4-r2-evidence/metadata.txt"

      - name: Run the seven F4 R2 Kill Switch specifications
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/f4-r2-evidence"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 512m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$artifacts,dst=/artifacts" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace \
            --workdir /workspace \
            python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -m unittest -v paper_execution.test_f4_risk_red.F4KillSwitchFailClosedRedTest \
            2>&1 | tee "$artifacts/unittest.log"
          echo "test_command=python -m unittest -v paper_execution.test_f4_risk_red.F4KillSwitchFailClosedRedTest" >> "$artifacts/metadata.txt"
          echo "expected_test_count=7" >> "$artifacts/metadata.txt"
          echo "expected_failures=0" >> "$artifacts/metadata.txt"
          echo "result=PASS" >> "$artifacts/metadata.txt"

      - name: Upload F4 R2 GREEN evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f4-r2-kill-switch-green-evidence
          path: ${{ runner.temp }}/f4-r2-evidence/
          if-no-files-found: error
          retention-days: 14
